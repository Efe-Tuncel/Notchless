name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Get version from tag
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        shell: bash

      - name: Build Release
        run: dotnet publish Notchless.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish -p:Version=${{ env.VERSION }} -p:AssemblyVersion=${{ env.VERSION }}.0 -p:FileVersion=${{ env.VERSION }}.0 -p:InformationalVersion=${{ github.ref_name }}

      # SignPath ile ücretsiz imzalama (repo public olunca aktif et)
      # - name: Sign with SignPath
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
      #     project-slug: notchless
      #     signing-policy-slug: release-signing
      #     github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      #     wait-for-completion: true

      - name: Create ZIP
        run: Compress-Archive -Path publish/* -DestinationPath Notchless-${{ github.ref_name }}-win-x64.zip

      - name: Copy exe for direct download
        run: Copy-Item publish/Notchless.exe Notchless-${{ github.ref_name }}-win-x64.exe

      - name: Build Setup exe
        shell: pwsh
        run: |
          choco install innosetup -y
          $iss = "installer/notchless.iss"
          (Get-Content $iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion ""$env:VERSION""" | Set-Content $iss -Encoding UTF8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $iss
          if (Test-Path "dist") { Get-ChildItem dist | ForEach-Object { Write-Host "dist: $($_.Name) $($_.Length)" } }
          # setup exe'yi release adına taşı
          $setup = Get-ChildItem dist -Filter "*.exe" | Select-Object -First 1
          if ($setup) { Copy-Item $setup.FullName "Notchless-${{ github.ref_name }}-Setup.exe"; Write-Host "Setup ready: Notchless-${{ github.ref_name }}-Setup.exe" } else { Write-Host "Setup not found, skipping"; New-Item -ItemType File -Path "Notchless-${{ github.ref_name }}-Setup.exe" -Value "dummy" | Out-Null }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Notchless-${{ github.ref_name }}-win-x64.zip
            Notchless-${{ github.ref_name }}-win-x64.exe
            Notchless-${{ github.ref_name }}-Setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
